services:
  traefik:
    image: "traefik:v3.4"
    restart: always
    container_name: "traefik"
    logging:
      options:
        max-size: 50m
    command:
      # Global
      - "--log.level=DEBUG"
      - "--api.insecure=false"
      - "--api.dashboard=true"

      # Providers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"

      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Certificates
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.email=your@mail.com"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"

      # Dashboard
      - "--entrypoints.traefik.address=:8080"

      # Plugins
      - "--experimental.plugins.fail2ban.moduleName=github.com/tomMoulard/fail2ban"
      - "--experimental.plugins.fail2ban.version=v0.8.7"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - "letsencrypt:/letsencrypt"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./.htpasswd:/etc/htpasswd"
      - "./traefik-plugins:/plugins-storage"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`traefik.example.domain.com`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.tls.certresolver=myresolver"
      - "traefik.http.routers.traefik.middlewares=traefik-auth"
      - "traefik.http.middlewares.traefik-auth.basicauth.usersfile=/etc/htpasswd"
    networks:
      - traefik
      
  portainer:
    image: portainer/portainer-ce
    container_name: "portainer"
    command: -H unix:///var/run/docker.sock
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portainer.rule=Host(`prt.example.domain.com`)"
      - "traefik.http.routers.portainer.entrypoints=websecure"
      - "traefik.http.routers.portainer.tls.certresolver=myresolver"
      - "traefik.http.services.portainer.loadbalancer.server.port=9000"
      - "traefik.http.routers.portainer-http.rule=Host(`prt.example.domain.com`)"
      - "traefik.http.routers.portainer-http.entrypoints=web"
      - "traefik.http.middlewares.portainer-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.portainer-http.middlewares=portainer-redirect"
      # enabled Fail2Ban plugin 
      - "traefik.http.routers.portainer.middlewares=portainer-fail2ban"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.rules.enabled=true"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.rules.maxretry=3"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.rules.findtime=5m"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.rules.bantime=1h"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.rules.statuscode=400,401,403-499"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.allowlist.ip=::1,127.0.0.1,192.168.0.0/24"
      - "traefik.http.middlewares.portainer-fail2ban.plugin.fail2ban.denylist.ip=1.2.3.4"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer_data:/data"
    networks:
      - traefik


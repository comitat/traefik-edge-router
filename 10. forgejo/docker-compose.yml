services:
  postgres:
    image: postgres:16
    container_name: forgejo-postgres
    restart: always
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: your_strong_db_password_here
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - forgejo

  forgejo:
    image: codeberg.org/forgejo/forgejo:13
    container_name: forgejo
    restart: always
    depends_on:
      - postgres
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=postgres:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=your_strong_db_password_here
      - FORGEJO__server__DOMAIN=git.your-domain.com
      - FORGEJO__server__ROOT_URL=https://git.your-domain.com/
      - FORGEJO__server__SSH_DOMAIN=git.your-domain.com
      - FORGEJO__server__SSH_PORT=10022
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__service__DISABLE_REGISTRATION=false
      - FORGEJO__security__INSTALL_LOCK=true
    volumes:
      - ./data/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "2222:22"
    networks:
      - forgejo
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.forgejo.rule=Host(`git.your-domain.com`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"
      - "traefik.http.routers.forgejo.tls.certresolver=myresolver"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"

networks:
  traefik:
    external: true
  forgejo:
    driver: bridge
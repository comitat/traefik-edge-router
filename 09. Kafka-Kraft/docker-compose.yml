services:
  kafka:
    image: confluentinc/cp-kafka:7.7.5
    hostname: kafka
    container_name: kafka-kraft
    ports:
      - "9092:9092"
      - "9093:9093"
      - "19092:19092"
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"

      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,SASL_PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,SASL_PLAINTEXT://external-ip:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,SASL_PLAINTEXT:SASL_PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_PLAINTEXT
      
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/kafka_server_jaas.conf

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Txs7_z0RSBqVIjHQ2MHJVw"
    volumes:
      - ./data:/var/lib/kafka/data
      - ./kafka_server_jaas.conf:/etc/kafka/kafka_server_jaas.conf
      - ./client.properties:/etc/kafka/client.properties
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - kafka

  akhq:
    image: tchiotludo/akhq:latest
    container_name: kafka-console
    environment:
      AKHQ_CONFIGURATION: |
        micronaut:
          security:
            enabled: false
        akhq:
          connections:
            stage-kafka:
              properties:
                bootstrap.servers: "kafka:19092"
                security.protocol: "SASL_PLAINTEXT"
                sasl.mechanism: "PLAIN"
                sasl.jaas.config: "org.apache.kafka.common.security.plain.PlainLoginModule required username='kafka-admin' password='admin_pass';"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.akhq.rule=Host(`kafka.yourdomain.com`)"
      - "traefik.http.routers.akhq.entrypoints=websecure"
      - "traefik.http.routers.akhq.tls.certresolver=le"
      - "traefik.http.services.akhq.loadbalancer.server.port=8080"
      - "traefik.http.routers.akhq.middlewares=akhq-auth,akhq-headers"
      - "traefik.http.middlewares.akhq-auth.basicauth.users=admin:$$apr1$$5doZS6oq$$.X5MNEjXpQohUuO6a6p991"
      - "traefik.http.middlewares.akhq-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.akhq-headers.headers.customrequestheaders.X-Forwarded-Prefix=/"

networks:
  traefik:
    external: true
  kafka:
    driver: bridge
services:
  headscale:
    image: headscale/headscale:v0.26
    container_name: headscale
    restart: unless-stopped
    volumes:
      - ${PWD}/config.yaml:/etc/headscale/config.yaml
      - ${PWD}/headscale-data/data:/var/lib/headscale
    command: serve
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.headscale.rule=Host(`headscale.yourdomain.com`) && PathPrefix(`/`)"
      - "traefik.http.routers.headscale.entrypoints=websecure"
      - "traefik.http.routers.headscale.tls.certresolver=myresolver"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"

  headscale-admin:
    image: goodieshq/headscale-admin:0.25.6
    container_name: headscale-admin
    restart: always
    networks:
      - traefik
    depends_on:
      - headscale
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.headscale-admin.rule=Host(`headscale.yourdomain.com`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.headscale-admin.entrypoints=websecure"
      - "traefik.http.routers.headscale-admin.tls.certresolver=myresolver"
      - "traefik.http.services.headscale-admin.loadbalancer.server.port=80"

